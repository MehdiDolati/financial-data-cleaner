name: Coverage

# Validator.Domain and Validator.Application carry the report's correctness, so
# their coverage is gated rather than merely reported. Both projects are measured
# from every test suite and merged, because the unit suites exercise them
# directly while the Infrastructure and CLI suites exercise them through the real
# pipeline; gating a single suite would understate what is actually covered.
#
# The gate enforces a true 100% line and 100% branch over all *reachable*
# Domain+Application code. Genuinely-unreachable defensive arms (private-constructor
# invariants, compiler-generated async state-machine helpers, and other provably
# unreachable branches) are individually excluded with documented justifications
# via [ExcludeFromCodeCoverage(Justification=…)]. See docs/coverage-exclusion-policy.md
# for the ordered decision rule (test → restructure → exclude).


on:
  push:
    branches: [ main, '00*-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Restore
        run: dotnet restore FinancialDataCleaner.slnx
      - name: Run tests with merged coverage and enforce the gate
        shell: pwsh
        run: ./tools/coverage-run.ps1 -LineThreshold 100 -BranchThreshold 100

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn
