name: Coverage

# Validator.Domain and Validator.Application carry the report's correctness, so
# their coverage is gated rather than merely reported. Both projects are measured
# from every test suite and merged, because the unit suites exercise them
# directly while the Infrastructure and CLI suites exercise them through the real
# pipeline; gating a single suite would understate what is actually covered.
#
# The target for both projects is 100% line and branch. Domain is there today.
# Application stands at 99.69% line / 99.03% branch merged. The six uncovered
# lines are defensive arms that no composition can reach: the invariants they
# restate are already enforced by ScanCoverage, DetailedSummary and
# ReportReconciliation, which refuse to hold a violating value in the first
# place. Deleting them to reach a round number would remove the second line of
# defence, so they are kept and the gate is set just below the measured figure
# as a ratchet against regression. Run tools/coverage-gaps.ps1 to enumerate them.



on:
  push:
    branches: [ main, '00*-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Restore
        run: dotnet restore FinancialDataCleaner.slnx
      - name: Run tests with merged coverage and enforce the gate
        shell: pwsh
        run: ./tools/coverage-run.ps1 -LineThreshold 99.6 -BranchThreshold 99.0

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn
