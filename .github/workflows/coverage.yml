name: Coverage

# Validator.Domain and Validator.Application carry the report's correctness, so
# their coverage is gated rather than merely reported. Both projects are measured
# from every test suite and merged, because the unit suites exercise them
# directly while the Infrastructure and CLI suites exercise them through the real
# pipeline; gating a single suite would understate what is actually covered.
#
# The target for both projects is 100% line and branch. Domain is there today.
# Application stands at 99.48% line / 98.56% branch, for a merged total of
# 99.59% / 98.83%. The remaining twelve uncovered lines are defensive arms that
# no composition can reach, and they fall into three groups:
#
#   * Private-constructor invariants. MetricScore and DatasetScore are only
#     reachable through factories that already pass a valid combination, so the
#     arms rejecting "scored but no value" or "available but carrying an
#     unavailability reason" cannot be provoked from outside.
#   * Closed-union default arms. CheckNameFor, DescribeKind, CategoryIndex and
#     IsHeaderRecord switch over fixed sets and throw on anything else.
#   * Guards a real run reaches only in the wrong order. The orchestrator's
#     reconciliation gate is unreachable because ReportReconciliation.Create
#     refuses a disagreeing catalog before the gate is consulted.
#
# Deleting them to reach a round number would remove the second line of defence,
# so they are kept and the gate is set just below the measured figure as a
# ratchet against regression. Run tools/coverage-gaps.ps1 to enumerate them.
#
# The gate sits roughly two tenths under the measured figure. That is deliberate:
# close enough that losing a covered path trips it, but not so close that the
# build depends on the last decimal place of a percentage.
#
# When this figure moves, re-measure with tools/coverage-run.ps1 and move the
# gate with it rather than leaving a threshold no run can satisfy: a gate above
# the achievable number fails every build without identifying a real defect.



on:
  push:
    branches: [ main, '00*-*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Restore
        run: dotnet restore FinancialDataCleaner.slnx
      - name: Run tests with merged coverage and enforce the gate
        shell: pwsh
        run: ./tools/coverage-run.ps1 -LineThreshold 99.4 -BranchThreshold 98.6

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage/
          if-no-files-found: warn
