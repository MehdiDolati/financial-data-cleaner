name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FinancialDataCleaner.sln
      - name: Build
        run: dotnet build FinancialDataCleaner.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test FinancialDataCleaner.sln --configuration Release --no-build --verbosity normal
      - name: Generate coverage (Domain+Application gate handled separately in CI tooling)
        run: echo "Coverage collection and gating to be implemented in CI as required"
